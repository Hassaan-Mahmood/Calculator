<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="brand">
        <span><span class="dot"></span>calc</span
        ><span id="modeLabel">deg</span>
      </div>

      <div class="display">
        <div class="history" id="history">&nbsp;</div>
        <div class="current" id="current"></div>
      </div>

      <div class="keys">
        <button class="key fn" onclick="calculator('AC')">AC</button>
        <button class="key fn" onclick="calculator('C')">C</button>
        <button class="key fn" onclick="calculator('%')">%</button>
        <!-- <button class="key op" onclick="calculator('÷')">÷</button> -->
        <button class="key op" onclick="calculator('/')">/</button>

        <button class="key" onclick="calculator(7)">7</button>
        <button class="key" onclick="calculator(8)">8</button>
        <button class="key" onclick="calculator(9)">9</button>
        <!-- <button class="key op" onclick="calculator('×')">×</button> -->
        <button class="key op" onclick="calculator('x')">x</button>

        <button class="key" onclick="calculator(4)">4</button>
        <button class="key" onclick="calculator(5)">5</button>
        <button class="key" onclick="calculator(6)">6</button>
        <!-- <button class="key op" onclick="calculator('−')">−</button> -->
        <button class="key op" onclick="calculator('-')">-</button>

        <button class="key" onclick="calculator(1)">1</button>
        <button class="key" onclick="calculator(2)">2</button>
        <button class="key" onclick="calculator(3)">3</button>
        <button class="key op" onclick="calculator('+')">+</button>

        <button class="key zero" onclick="calculator(0)">0</button>
        <button class="key" onclick="calculator('.')">.</button>
        <button class="key equals" onclick="equalOperation()">=</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
